# Netlify Configuration for Laureign Studios Packages
[build]
  publish = "."

[[redirects]]
  from = "/events"
  to = "/events/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/events/*"
  to = "/events/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/laureighn-events"
  to = "/events/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/"
  to = "/packages/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/packages"
  to = "/packages/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/packages/"
  to = "/packages/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/css/*"
  to = "/packages/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/packages/js/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/packages/images/:splat"
  status = 200

[[redirects]]
  from = "/samples/*"
  to = "/packages/samples/:splat"
  status = 200

[[redirects]]
  from = "/posters/*"
  to = "/packages/posters/:splat"
  status = 200

[[redirects]]
  from = "/apple/*"
  to = "/packages/apple/:splat"
  status = 200

[[redirects]]
  from = "/qr-poster"
  to = "/packages/qr-poster.html"
  status = 200

[[redirects]]
  from = "/:page.html"
  to = "/packages/:page.html"
  status = 200

[[redirects]]
  from = "/:page"
  to = "/packages/:page.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
